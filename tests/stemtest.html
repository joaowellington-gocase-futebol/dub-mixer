<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>DUB-MIXER stem test</title>
  <style>body { background: #111; color: #ddd; font: 13px monospace; padding: 16px; } td, th { padding: 2px 10px; text-align: right; } th:first-child, td:first-child, td:nth-child(2) { text-align: left; }</style>
</head>
<body>
  <h3>Stem test: DSP vs AI (npm run dev → /tests/stemtest.html)</h3>
  <pre id="log">rodando…</pre>
  <table id="out"></table>
  <script type="module">
    import { run } from './stemtest.js';
    const log = document.getElementById('log');
    const ol = console.log;
    let last = '';
    console.log = (...a) => { const s = a.join(' '); ol(...a); if (s.split(' ').slice(0, 3).join(' ') !== last.split(' ').slice(0, 3).join(' ')) log.textContent += '\n' + s; else log.textContent = log.textContent.replace(/[^\n]*$/, s); last = s; };
    run().then((r) => {
      window.__stemtest = r;
      const t = document.getElementById('out');
      const cols = Object.keys(r.table[0]);
      t.innerHTML = `<tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>` + r.table.map((row) => `<tr>${cols.map((c) => `<td>${row[c]}</td>`).join('')}</tr>`).join('');
      log.textContent += `\nAI reconstruction SNR at unity (dB): ${JSON.stringify(Object.fromEntries(Object.entries(r).filter(([, v]) => v && v.aiUnitySNR_dB != null).map(([k, v]) => [k, v.aiUnitySNR_dB])))}\nOK`;
    }, (e) => { window.__stemtest = { error: String(e && e.stack || e) }; log.textContent += '\nERRO: ' + (e && e.stack || e); });
  </script>
</body>
</html>
